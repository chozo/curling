<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>カーリング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="CPU と対戦する 3D カーリング。目印をねらって、ゲージをタップして投げ、ストーンの前をこすって伸ばす。先攻・後攻も選べる。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="カーリング" />
    <meta property="og:title" content="カーリング" />
    <meta property="og:description" content="CPU と対戦する 3D カーリング。目印をねらって、ゲージをタップして投げ、ストーンの前をこすって伸ばす。先攻・後攻も選べる。" />
    <meta property="og:url" content="https://game.chozo.net/curling/" />
    <meta property="og:image" content="https://game.chozo.net/curling/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ハウスへ滑り込むストーンをスイープする3Dのシートと、顔のある赤・黄のストーンのイラスト。タイトル「カーリング」" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>

      <div id="hud">
        <div id="board-wrap"><table id="board" class="board"></table><div id="stones-left"></div></div>
        <canvas id="minimap" width="220" height="250"></canvas>
      </div>
      <div id="sweep-zone"><span>← こする →</span></div>
      <div id="sweep-meter"><div id="sweep-bar"></div><span>スイープ</span></div>
      <div id="gauge">
        <div id="gauge-bar"></div>
        <div id="gauge-labels"></div>
        <div id="gauge-marker"></div>
      </div>
      <button id="throw-btn" type="button">投げる</button>
      <div id="hint"></div>
      <div id="toast"></div>
      <div id="cpu-think"></div>
      <button id="spin-btn" type="button"></button>

      <div id="title" class="overlay title-screen">
        <div class="ts-bg" aria-hidden="true">
          <div class="ts-house"><i></i><i></i><i></i><i></i></div>
          <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✧</span>
          <span class="spark s4">✦</span><span class="spark s5">✧</span>
        </div>

        <div class="ts-head">
          <p class="ts-catch">CPU とガチンコ勝負！</p>
          <h1 class="ts-logo" aria-label="カーリング">
            <span style="--i: 0">カ</span><span style="--i: 1">ー</span><span style="--i: 2">リ</span><span style="--i: 3">ン</span><span style="--i: 4">グ</span>
          </h1>
        </div>

        <div class="ts-art" aria-hidden="true">
          <svg class="stone stone-yellow" viewBox="0 0 240 190">
            <use href="#stone-body" />
            <ellipse cx="120" cy="66" rx="58" ry="20" fill="#ffd23f" />
            <ellipse cx="108" cy="60" rx="26" ry="7" fill="#fff6c4" opacity=".7" />
            <path d="M84 62 Q84 22 120 22 Q160 22 160 46 L160 58" fill="none" stroke="#e6a800" stroke-width="15" stroke-linecap="round" />
            <path d="M84 62 Q84 22 120 22 Q160 22 160 46 L160 58" fill="none" stroke="#ffd23f" stroke-width="9" stroke-linecap="round" />
            <path d="M95 34 Q104 27 116 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8" />
            <!-- 顔: ウインク -->
            <path d="M86 116 q8 -8 16 0" fill="none" stroke="#1b2333" stroke-width="5" stroke-linecap="round" />
            <ellipse cx="146" cy="114" rx="6" ry="8" fill="#1b2333" /><circle cx="148" cy="111" r="2.4" fill="#fff" />
            <ellipse cx="76" cy="128" rx="9" ry="5" fill="#ff8fa3" opacity=".75" />
            <ellipse cx="164" cy="128" rx="9" ry="5" fill="#ff8fa3" opacity=".75" />
            <path d="M112 128 q8 8 16 0" fill="none" stroke="#1b2333" stroke-width="4.5" stroke-linecap="round" />
          </svg>
          <svg class="stone stone-red" viewBox="0 0 240 190">
            <use href="#stone-body" />
            <ellipse cx="120" cy="66" rx="58" ry="20" fill="#ff4b55" />
            <ellipse cx="106" cy="60" rx="26" ry="7" fill="#ffc2c6" opacity=".7" />
            <path d="M84 62 Q84 22 120 22 Q160 22 160 46 L160 58" fill="none" stroke="#c4202b" stroke-width="15" stroke-linecap="round" />
            <path d="M84 62 Q84 22 120 22 Q160 22 160 46 L160 58" fill="none" stroke="#ff4b55" stroke-width="9" stroke-linecap="round" />
            <path d="M95 34 Q104 27 116 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8" />
            <!-- 顔: キラキラ目 -->
            <ellipse cx="94" cy="114" rx="7" ry="9" fill="#1b2333" /><circle cx="96.5" cy="110.5" r="3" fill="#fff" />
            <ellipse cx="146" cy="114" rx="7" ry="9" fill="#1b2333" /><circle cx="148.5" cy="110.5" r="3" fill="#fff" />
            <ellipse cx="78" cy="129" rx="10" ry="5.5" fill="#ff8fa3" opacity=".8" />
            <ellipse cx="162" cy="129" rx="10" ry="5.5" fill="#ff8fa3" opacity=".8" />
            <path d="M110 126 q10 12 20 0 z" fill="#1b2333" />
            <path d="M114 130 q6 5 12 0" fill="#ff6b7d" />
          </svg>
          <svg class="broom" viewBox="0 0 120 240">
            <rect x="54" y="0" width="12" height="170" rx="6" fill="#ffffff" />
            <rect x="54" y="0" width="5" height="170" rx="2.5" fill="#dfe8f4" />
            <rect x="14" y="166" width="92" height="30" rx="12" fill="#2a3a5c" />
            <rect x="18" y="190" width="84" height="16" rx="6" fill="#3fc1ff" />
          </svg>
          <div class="ts-ice"></div>
          <svg width="0" height="0" style="position: absolute">
            <defs>
              <linearGradient id="granite" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#9aa3b1" />
                <stop offset="1" stop-color="#5e6676" />
              </linearGradient>
              <g id="stone-body">
                <ellipse cx="120" cy="176" rx="84" ry="12" fill="#0b2a55" opacity=".25" />
                <path d="M30 92 Q30 64 120 62 Q210 64 210 92 L210 132 Q210 172 120 174 Q30 172 30 132 Z" fill="url(#granite)" />
                <path d="M30 108 Q120 126 210 108 L210 120 Q120 138 30 120 Z" fill="#c9d0db" opacity=".55" />
                <ellipse cx="120" cy="80" rx="88" ry="26" fill="#b7bfcb" />
                <ellipse cx="120" cy="80" rx="88" ry="26" fill="none" stroke="#e7ecf3" stroke-width="3" opacity=".7" />
                <circle cx="58" cy="146" r="3" fill="#4a5160" /><circle cx="180" cy="150" r="2.5" fill="#4a5160" />
                <circle cx="150" cy="158" r="2" fill="#4a5160" /><circle cx="72" cy="96" r="2" fill="#7c8595" />
                <circle cx="190" cy="98" r="2.4" fill="#7c8595" /><circle cx="100" cy="160" r="2" fill="#4a5160" />
                <path d="M44 98 Q46 140 70 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35" />
              </g>
            </defs>
          </svg>
        </div>

        <ul class="ts-howto">
          <li><b class="n">1</b><span class="ic">↔</span><span>ドラッグで<br />ねらう</span></li>
          <li><b class="n">2</b><span class="ic">👆</span><span>ゲージを<br />タップ！</span></li>
          <li><b class="n">3</b><span class="ic">🧹</span><span>こすって<br />のばす</span></li>
        </ul>

        <div class="ts-options">
          <div class="choice">
            <div class="choice-label">1エンド目</div>
            <div class="seg" id="order-seg">
              <button type="button" data-v="first">先攻</button>
              <button type="button" data-v="second" class="on">後攻</button>
            </div>
          </div>
          <div class="choice">
            <div class="choice-label">エンド数</div>
            <div class="seg" id="ends-seg">
              <button type="button" data-v="1">1</button>
              <button type="button" data-v="2" class="on">2</button>
              <button type="button" data-v="3">3</button>
            </div>
          </div>
        </div>
        <p class="choice-note" id="order-note"></p>
        <button id="start-btn" type="button" class="primary ts-start">あそぶ！</button>
      </div>

      <div id="result" class="overlay hidden">
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <table id="result-board" class="board"></table>
        <button id="next-btn" type="button" class="primary">次のエンドへ</button>
        <button id="again-btn" type="button" class="primary">もう一度</button>
        <button id="title-btn" type="button" class="ghost">タイトルへ</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
